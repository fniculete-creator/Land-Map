<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LAAA Land">
  <!-- Builder emoji: yellow smiley in a blue hard hat holding a hammer.
       Original drawing (favicon-scale), replaces the gold hard-hat mark. -->
  <!-- hammer: steel head + claw over a green grip, held up at the left -->
  <g transform="rotate(-10 20 52)">
    <rect x="14" y="42" width="10" height="26" rx="4" fill="#3f9c46" stroke="#2e7233" stroke-width="1.5"/>
    <path d="M10 28 Q2 22 8 15 Q9 24 16 27 Z" fill="#b9c3cc" stroke="#7d8a95" stroke-width="1.5"/>
    <rect x="6" y="26" width="28" height="14" rx="4" fill="#b9c3cc" stroke="#7d8a95" stroke-width="2"/>
  </g>
  <!-- face -->
  <circle cx="60" cy="62" r="32" fill="#ffd23f" stroke="#e0a800" stroke-width="2.5"/>
  <!-- eyes -->
  <ellipse cx="49" cy="60" rx="7" ry="8.5" fill="#fff"/>
  <ellipse cx="71" cy="60" rx="7" ry="8.5" fill="#fff"/>
  <circle cx="50.5" cy="62" r="3.8" fill="#22303c"/>
  <circle cx="69.5" cy="62" r="3.8" fill="#22303c"/>
  <!-- smile -->
  <path d="M47 76 Q60 89 73 76 Q60 82 47 76 Z" fill="#a3341f"/>
  <!-- blue hard hat, sitting above the eyes -->
  <path d="M32 36 C32 16 45 8 60 8 C75 8 88 16 88 36 L88 40 L32 40 Z" fill="#2b6cdf" stroke="#1d4fae" stroke-width="2.5"/>
  <rect x="53" y="3" width="14" height="13" rx="6" fill="#2b6cdf" stroke="#1d4fae" stroke-width="2"/>
  <path d="M26 38 C46 46 74 46 94 38 C92 44 87 47 79 47 L41 47 C33 47 28 44 26 38 Z" fill="#1d4fae"/>
  <!-- fist around the grip -->
  <circle cx="21" cy="64" r="8" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>
</svg>
