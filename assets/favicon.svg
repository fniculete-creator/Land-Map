<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LAAA">
  <!-- Gold hard hat over the LAAA wordmark (favicon-scale redraw of the team icon). -->
  <!-- ridge on top of the dome -->
  <rect x="41" y="6" width="18" height="22" rx="8" fill="#e8b007" stroke="#c99700" stroke-width="3"/>
  <!-- dome -->
  <path d="M15 50 C15 27 30 14 50 14 C70 14 85 27 85 50 L85 53 L15 53 Z"
        fill="#e8b007" stroke="#c99700" stroke-width="3"/>
  <!-- side vent ribs -->
  <path d="M32 22 L32 38 M68 22 L68 38" stroke="#c99700" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- brim -->
  <path d="M8 50 C30 60 70 60 92 50 C90 58 83 62 74 63 C58 68 42 68 26 63 C17 62 10 58 8 50 Z"
        fill="#d9a406" stroke="#c99700" stroke-width="3" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="50" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="27" font-weight="900" fill="#c99700" letter-spacing="1">LAAA</text>
</svg>
